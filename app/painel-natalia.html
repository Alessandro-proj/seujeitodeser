<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf6f0">
<title>Painel de respostas · Natalia Nunes</title>
<style>
:root { color-scheme: light; --paper:#faf6f0; --ink:#322338; --muted:#635467; --line:#e4d8df; --accent:#5f3c75; --white:#fffdfa; font-family:system-ui,sans-serif; background:var(--paper); color:var(--ink); }
*, *::before, *::after { box-sizing:border-box; }
body { margin:0; min-height:100vh; }
[hidden] { display:none !important; }
:focus-visible { outline:3px solid #8b5fa0; outline-offset:4px; }
button, input { font:inherit; }
button { cursor:pointer; }
h1, h2, p { margin:0; }
a { color:var(--accent); text-underline-offset:4px; }
.wrap { max-width:1000px; margin:auto; padding-inline:clamp(16px,4vw,32px); }
header { display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:76px; border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:10px; }
.monogram { display:grid; place-content:center; flex:0 0 40px; aspect-ratio:1; border:1px solid #b98264; border-radius:50%; background:#fff9f2; color:#70412e; font:20px/.7 Georgia,serif; }
.monogram span { grid-area:1 / 1; transform:translate(-17%,-19%); }
.monogram span + span { color:#a36048; transform:translate(18%,19%); }
.brand strong { display:block; font:1.25rem Georgia,serif; }
.brand small { display:block; margin-top:3px; color:#755248; text-transform:uppercase; font-size:.58rem; font-weight:680; letter-spacing:.18em; }
main { padding-block:clamp(30px,7vw,68px); }
h1 { margin-bottom:12px; font:400 clamp(2.25rem,7vw,4rem)/.98 Georgia,serif; letter-spacing:-.06em; }
h2 { font:400 1.8rem Georgia,serif; }
p { color:var(--muted); line-height:1.55; }
.login { width:min(100%,450px); margin:auto; padding:clamp(20px,5vw,36px); background:var(--white); border:1px solid var(--line); border-radius:24px; box-shadow:0 13px 30px #34253409; }
.field { display:grid; gap:8px; margin-top:17px; font-size:.89rem; font-weight:650; }
input { width:100%; min-height:47px; padding:10px 12px; border:1px solid #c9bbc8; border-radius:10px; background:#fff; color:var(--ink); }
.button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:9px 16px; border:1px solid transparent; border-radius:30px; background:#302536; color:white; font-weight:700; font-size:.9rem; }
.button:hover { background:var(--accent); }
.button:disabled { opacity:.65; cursor:wait; }
.secondary { color:var(--ink); background:var(--white); border-color:#c9bbc8; }
.secondary:hover { background:#eee4f4; }
.login .button { width:100%; margin-top:20px; }
.feedback { color:#8a3651; margin-top:12px; font-size:.88rem; }
.feedback:empty { margin:0; }
.toolbar { display:flex; align-items:end; gap:12px; margin:23px 0 17px; }
.toolbar .field { flex:1; margin:0; }
.responses { display:grid; gap:9px; margin:0; padding:0; list-style:none; }
.response { display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; text-align:left; min-height:63px; padding:12px 16px; border:1px solid var(--line); border-radius:14px; color:var(--ink); background:var(--white); }
.response:hover { border-color:#aa84bd; }
.response span { display:block; overflow-wrap:anywhere; font-weight:700; }
.response .time { margin-top:3px; color:var(--muted); font-size:.82rem; font-weight:400; }
.empty { padding:21px; border:1px dashed #c9bbc8; border-radius:14px; }
dialog { width:min(650px,calc(100% - 28px)); max-height:calc(100% - 28px); padding:clamp(16px,5vw,28px); overflow:auto; border:1px solid #d3c0d6; border-radius:20px; background:var(--white); color:var(--ink); }
dialog::backdrop { background:#25162c88; }
.dialog-head { display:flex; align-items:start; justify-content:space-between; gap:12px; }
.dialog-head h2 { overflow-wrap:anywhere; }
.answers h3 { margin-bottom:5px; font-size:1rem; color:var(--accent); }
.answers ul { margin-top:6px; padding-left:21px; }
.answers li { margin:5px 0; line-height:1.45; }
.signature { width:100%; display:block; border:1px solid var(--line); margin-top:8px; background:#fff; border-radius:10px; }
@media (max-width:420px) { .toolbar { flex-wrap:wrap; } .toolbar .field { flex-basis:100%; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="monogram" aria-hidden="true"><span>N</span><span>N</span></span>
      <div><strong>Natalia Nunes</strong><small>Psicanalista</small></div>
    </div>
    <button class="button secondary" id="logout" type="button" hidden>Sair</button>
  </header>
  <main>
    <p id="loading" role="status">Abrindo painel…</p>
    <section class="login" id="access" hidden>
      <h1 id="access-title">Entrar no painel</h1>
      <p id="access-help">Acesse as respostas recebidas no teste.</p>
      <form id="credentials">
        <label class="field" id="code-field" hidden>Código de configuração
          <input id="code" type="password" autocomplete="off" maxlength="80">
        </label>
        <label class="field">Senha
          <input id="password" type="password" autocomplete="current-password" maxlength="128" required>
        </label>
        <button class="button" id="enter" type="submit">Entrar</button>
        <p class="feedback" id="access-error" role="alert"></p>
      </form>
    </section>
    <section id="dashboard" hidden>
      <h1 id="dashboard-title" tabindex="-1">Respostas recebidas</h1>
      <p id="summary" role="status"></p>
      <div class="toolbar">
        <label class="field">Buscar por nome
          <input id="search" type="search" placeholder="Digite o nome da pessoa">
        </label>
        <button class="button secondary" id="refresh" type="button">Atualizar</button>
      </div>
      <ol class="responses" id="responses"></ol>
      <p class="empty" id="empty" hidden></p>
      <p class="feedback" id="dashboard-error" role="alert"></p>
    </section>
  </main>
</div>

<dialog id="details" aria-labelledby="details-title">
  <div class="dialog-head">
    <div><h2 id="details-title">Resposta</h2><p id="details-time"></p></div>
    <form method="dialog"><button class="button secondary">Fechar</button></form>
  </div>
  <div class="answers" id="answers"></div>
  <section id="signed" hidden>
    <h3>Assinatura</h3>
    <img class="signature" id="signature" alt="Assinatura feita pela pessoa na tela">
  </section>
</dialog>

<script>
const get = id => document.getElementById(id);
const date = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
const profiles = { s: 'Sanguíneo', c: 'Colérico', m: 'Melancólico', f: 'Fleumático' };
const details = get('details');
let rows = [];
let setup = false;

if (location.hash) {
  get('code').value = location.hash.slice(1);
  history.replaceState(null, '', location.pathname);
}

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  };
  const response = await fetch('/api/admin/' + path, options);
  const data = await response.json();
  if (!response.ok) {
    const error = new Error(data.error || 'Não foi possível acessar o painel.');
    error.status = response.status;
    throw error;
  }
  return data;
}

function showAccess(configured) {
  setup = !configured;
  get('loading').hidden = true;
  get('logout').hidden = true;
  get('dashboard').hidden = true;
  get('access').hidden = false;
  get('access-title').textContent = setup ? 'Configure seu acesso' : 'Entrar no painel';
  get('access-help').textContent = setup ? 'Defina uma senha para o painel da Natalia. Use pelo menos 12 caracteres.' : 'Acesse as respostas recebidas no teste.';
  get('code-field').hidden = !setup;
  get('code').required = setup;
  get('password').autocomplete = setup ? 'new-password' : 'current-password';
  get('password').minLength = setup ? 12 : 1;
  get('enter').textContent = setup ? 'Criar senha e entrar' : 'Entrar';
  get('password').value = '';
  get('access-error').textContent = '';
  rows = [];
  get('responses').replaceChildren();
  get('search').value = '';
  get('summary').textContent = '';
  details.close();
  get('answers').replaceChildren();
  get('signature').removeAttribute('src');
  get('details-title').textContent = 'Resposta';
  get('details-time').textContent = '';
}

function searchable(text) {
  return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR');
}

function renderRows() {
  const list = get('responses');
  const term = searchable(get('search').value.trim());
  const matches = rows.filter(row => searchable(row.name).includes(term));
  list.replaceChildren();
  for (const row of matches) {
    const item = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'response';
    const text = document.createElement('span');
    const name = document.createElement('span');
    name.textContent = row.name;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = date.format(new Date(row.received_at));
    const arrow = document.createElement('span');
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '→';
    text.append(name, time);
    button.append(text, arrow);
    button.addEventListener('click', () => showDetails(row.id));
    item.append(button);
    list.append(item);
  }
  get('empty').hidden = matches.length !== 0;
  get('empty').textContent = rows.length ? 'Nenhum nome encontrado.' : 'Ainda não há respostas enviadas.';
  get('summary').textContent = rows.length === 1 ? '1 envio' : rows.length + ' envios';
}

async function loadRows() {
  const refresh = get('refresh');
  refresh.disabled = true;
  get('dashboard-error').textContent = '';
  try {
    rows = await api('responses');
    renderRows();
  } catch (error) {
    if (error.status === 401) showAccess(true);
    else get('dashboard-error').textContent = error.message;
  } finally {
    refresh.disabled = false;
  }
}

function showDashboard() {
  get('code').value = '';
  get('password').value = '';
  get('loading').hidden = true;
  get('access').hidden = true;
  get('dashboard').hidden = false;
  get('logout').hidden = false;
  get('dashboard-title').focus();
  loadRows();
}

async function showDetails(id) {
  get('dashboard-error').textContent = '';
  try {
    const record = await api('responses/' + id);
    get('details-title').textContent = record.name;
    get('details-time').textContent = date.format(new Date(record.received_at));
    const answers = get('answers');
    answers.replaceChildren();
    for (const [key, label] of Object.entries(profiles)) {
      const entries = record.answers.filter(answer => answer.profile === key);
      if (!entries.length) continue;
      const heading = document.createElement('h3');
      heading.textContent = label;
      const list = document.createElement('ul');
      for (const answer of entries) {
        const item = document.createElement('li');
        item.textContent = answer.text;
        list.append(item);
      }
      answers.append(heading, list);
    }
    get('signature').src = '/api/admin/responses/' + id + '/signature';
    get('signed').hidden = false;
    if (!details.open) details.showModal();
  } catch (error) {
    if (error.status === 401) showAccess(true);
    else get('dashboard-error').textContent = error.message;
  }
}

get('credentials').addEventListener('submit', async event => {
  event.preventDefault();
  get('access-error').textContent = '';
  get('enter').disabled = true;
  try {
    await api(setup ? 'setup' : 'login', { code: get('code').value, password: get('password').value });
    showDashboard();
  } catch (error) {
    get('access-error').textContent = error.message;
  } finally {
    get('enter').disabled = false;
  }
});
get('logout').addEventListener('click', async () => {
  try {
    await api('logout', {});
    showAccess(true);
  } catch (error) {
    if (error.status === 401) showAccess(true);
    else get('dashboard-error').textContent = error.message;
  }
});
get('refresh').addEventListener('click', loadRows);
get('search').addEventListener('input', renderRows);

api('status').then(status => {
  if (status.authenticated) showDashboard();
  else showAccess(status.configured);
}).catch(() => {
  get('loading').textContent = 'Não foi possível abrir o painel. Recarregue a página para tentar novamente.';
});
</script>
</body>
</html>
